name: Public Site Intake Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "tests/public-intake-runtime.test.mjs"
      - ".github/workflows/public-site-intake-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check public JavaScript
        run: |
          set -euo pipefail
          node --check script.js
          node --check conversion-v1.js
          node --check conversion-v1-base.js
          node --check quick-solar-check.js
          node --check calculator-v2.js

      - name: Run behavioral public intake regression tests
        run: node --test tests/public-intake-runtime.test.mjs

      - name: Verify V3 acknowledgement contracts remain present
        run: |
          set -euo pipefail
          grep -q "https://intake.energywithmark.com.au/api/public/website-intake/v1" conversion-v1.js
          grep -Fq "https://intake.energywithmark.com.au/api/public/website-intake/v1?receipt=bill" conversion-v1.js
          grep -q "https://intake.energywithmark.com.au/api/public/website-intake/v1" book.html
          grep -q "directV3Submit" conversion-v1.js
          grep -q "energy-with-mark-bill-upload-submit" conversion-v1.js
          ! grep -q "energy-with-mark-assessment-submit" conversion-v1.js
          ! grep -q "script.google.com" book.html
          grep -q "hardenQuickLead" conversion-v1.js
          grep -q "hardenFullCalculatorLead" conversion-v1.js
          grep -q "hardenBillUpload" conversion-v1.js
          grep -q "hardenGeneralEnquiry" conversion-v1.js
          grep -q "https://intake.energywithmark.com.au/api/public/website-intake/v1" quick-solar-check.js
          grep -q "https://intake.energywithmark.com.au/api/public/website-intake/v1" calculator-v2.js
          grep -q "ewmV3Hardened" conversion-v1.js
          grep -q "ewmV3Hardened" quick-solar-check.js
          grep -q "ewmV3Hardened" calculator-v2.js
          ! grep -q "script.google.com" quick-solar-check.js
          ! grep -q "script.google.com" calculator-v2.js
          grep -q 'data-form-type="enquiry"' contact.html
          grep -q 'name="postcode"' book.html
          grep -q 'name="address"' book.html
          grep -q 'name="address"' contact.html
          grep -q 'name="address"' upload-bill.html
          grep -q 'id="quickAddress"' index.html
          grep -q 'id="leadAddress"' calculator.html
          grep -q 'What type of property is this?' index.html
          grep -q 'What type of property are we checking?' calculator.html
          grep -q 'href="/example-assessment.html">See an Example Assessment' upload-bill.html
          grep -q 'href="/example-assessment.html">See Example Assessment' index.html
          grep -q 'Example Energy Assessment' example-assessment.html
          grep -q 'See how your assessment is presented' example-assessment.html
          grep -q 'single-property example' example-assessment.html
          grep -q 'Strong solar opportunity' example-assessment.html
          grep -q 'Page 1 of 3' example-assessment.html
          grep -q 'Page 2 of 3' example-assessment.html
          grep -q 'Page 3 of 3' example-assessment.html
          ! grep -q 'Property B' example-assessment.html
          ! grep -q 'Property C' example-assessment.html
          test -s example-assessment.css

      - name: Verify V4 branded contact and marketing-consent contracts
        run: |
          set -euo pipefail
          for file in index.html contact.html book.html upload-bill.html calculator.html privacy.html; do
            grep -Fq 'mark@energywithmark.com.au' "$file"
            ! grep -Fq 'mark.fitzpatrick@classaenergy.com.au' "$file"
          done
          grep -Fq 'id="marketing-emails"' privacy.html
          grep -Fq 'Marketing email consent is separate from the privacy acknowledgement' privacy.html
          grep -Fq 'name="marketingConsent"' index.html
          grep -Fq 'name="marketingConsent"' calculator.html
          grep -Fq 'name="marketingConsent"' contact.html
          grep -Fq 'name="marketingConsent"' book.html
          grep -Fq 'name="marketingConsent"' upload-bill.html

      - name: Verify production intake and V4 backend readiness without creating a lead
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://intake.energywithmark.com.au/api/public/website-intake/v1"
          v4_readiness_url="https://intake.energywithmark.com.au/api/public/website-intake/v1?readiness=v4"
          origin="https://energywithmark.com.au"

          root_status="$(curl -sS -o /tmp/ewm-root-body -D /tmp/ewm-root-headers -w '%{http_code}' "https://intake.energywithmark.com.au/")"
          echo "Intake hostname root status: $root_status"
          sed -n '1,20p' /tmp/ewm-root-headers
          cat /tmp/ewm-root-body || true
          # The hostname root may remain protected by Cloudflare Access. The public
          # contract is the exact intake path below, not the hostname root.
          test "$root_status" != "200"

          options_status="$(curl -sS -o /tmp/ewm-options-body -D /tmp/ewm-options-headers -w '%{http_code}' -X OPTIONS "$endpoint" \
            -H "Origin: $origin" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,idempotency-key")"
          echo "OPTIONS status: $options_status"
          sed -n '1,20p' /tmp/ewm-options-headers
          cat /tmp/ewm-options-body || true
          test "$options_status" = "204"
          grep -qi "^access-control-allow-origin: $origin" /tmp/ewm-options-headers

          invalid_status="$(curl -sS -o /tmp/ewm-invalid-body -D /tmp/ewm-invalid-headers -w '%{http_code}' -X POST "$endpoint" \
            -H "Origin: $origin" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ci-no-write-connectivity-check" \
            --data '{}')"
          echo "Invalid POST status: $invalid_status"
          sed -n '1,20p' /tmp/ewm-invalid-headers
          cat /tmp/ewm-invalid-body || true
          test "$invalid_status" = "400"
          grep -qi "^access-control-allow-origin: $origin" /tmp/ewm-invalid-headers
          grep -q '"ok":false' /tmp/ewm-invalid-body
          grep -q 'Please provide your name, phone, valid email and consent' /tmp/ewm-invalid-body

          receipt_request_id="ewm-bill-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          receipt_status="$(curl -sS --max-time 15 -o /tmp/ewm-bill-receipt-body -D /tmp/ewm-bill-receipt-headers -w '%{http_code}'             "$endpoint?receipt=bill&requestId=$receipt_request_id"             -H "Origin: $origin")"
          echo "Read-only bill receipt verifier status: $receipt_status"
          cat /tmp/ewm-bill-receipt-body || true
          test "$receipt_status" = "200"
          grep -qi "^access-control-allow-origin: $origin" /tmp/ewm-bill-receipt-headers
          grep -Fq '"ok":true' /tmp/ewm-bill-receipt-body
          grep -Fq '"received":false' /tmp/ewm-bill-receipt-body
          grep -Fq '"fileStored":false' /tmp/ewm-bill-receipt-body
          grep -Fq '"status":"waiting"' /tmp/ewm-bill-receipt-body

          readiness_status="$(curl -sS --max-time 15 -o /tmp/ewm-v4-premerge-readiness -w '%{http_code}' "$v4_readiness_url" || true)"
          echo "V4 production readiness status: $readiness_status"
          cat /tmp/ewm-v4-premerge-readiness || true
          test "$readiness_status" = "200" -o "$readiness_status" = "202"
          grep -Fq '"version":"v4"' /tmp/ewm-v4-premerge-readiness
          grep -Fq '"schemaReady":true' /tmp/ewm-v4-premerge-readiness
          grep -Fq '"runtimeArmed":true' /tmp/ewm-v4-premerge-readiness
          grep -Fq '"attestationReady":true' /tmp/ewm-v4-premerge-readiness


      - name: Verify Build 61C production fingerprint and bill-processing readiness
        shell: bash
        run: |
          set -euo pipefail
          v5_url="https://intake.energywithmark.com.au/api/public/website-intake/v1?readiness=v5"
          expected_fingerprint="14eca8031412a29d2822dd4fbceb00f9"
          status="$(curl -sS --max-time 15 -o /tmp/ewm-v5-61b -w '%{http_code}' -H 'Cache-Control: no-cache' "$v5_url")"
          echo "Build 61C production proof status: $status"
          cat /tmp/ewm-v5-61b || true
          test "$status" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/ewm-v5-61b','utf8'));
          const expected = '14eca8031412a29d2822dd4fbceb00f9';
          if (body?.version !== 'v5' || body?.ready !== true) throw new Error('V5 readiness is not ready');
          if (body?.deployment?.commitFingerprint !== expected) throw new Error('Build 61C fingerprint mismatch');
          for (const key of ['websiteIntakeRecords','websiteBillRecords','websiteBillFilesLinked','websiteBillEvidenceRecords','websiteBillAnalyses','websiteBillVerifiedAnalyses','websiteBillAssessmentsPrepared']) {
            if (!Number.isFinite(Number(body?.operationalState?.[key]))) throw new Error('Missing Build 61C counter: '+key);
          }
          if (Number(body.operationalState.websiteIntakeRecords) < 1) throw new Error('Expected existing website intake evidence');
          if (Number(body.operationalState.websiteBillRecords) < 1) throw new Error('Expected existing website bill evidence');
          if (Number(body.operationalState.websiteBillFilesLinked) < 1) throw new Error('Expected existing website bill Drive linkage');
          console.log('Build 61C exact deployment and bill-processing observability verified.');
          NODE


      - name: Verify existing-solar assessment path remains present
        run: |
          set -euo pipefail
          grep -q "Current solar size" conversion-v1.js
          grep -q "existingBattery" conversion-v1.js
          grep -q "existingSystemAge" conversion-v1.js
          grep -q "existingInverter" conversion-v1.js
          grep -q "Do you already have solar" index.html
          grep -q "What do you already have" calculator.html

      - name: Verify rollback base exists
        run: |
          set -euo pipefail
          test -s conversion-v1-base.js

      - name: Verify deployed public site carries the V3 intake cutover
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://intake.energywithmark.com.au/api/public/website-intake/v1"
          v4_readiness_url="https://intake.energywithmark.com.au/api/public/website-intake/v1?readiness=v4"
          conversion_url="https://energywithmark.com.au/conversion-v1.js?deploy=$GITHUB_SHA"
          booking_url="https://energywithmark.com.au/book.html?deploy=$GITHUB_SHA"
          example_url="https://energywithmark.com.au/example-assessment.html?deploy=$GITHUB_SHA"
          contact_url="https://energywithmark.com.au/contact.html?deploy=$GITHUB_SHA"
          upload_url="https://energywithmark.com.au/upload-bill.html?deploy=$GITHUB_SHA"
          home_url="https://energywithmark.com.au/?deploy=$GITHUB_SHA"
          calculator_url="https://energywithmark.com.au/calculator.html?deploy=$GITHUB_SHA"
          privacy_url="https://energywithmark.com.au/privacy.html?deploy=$GITHUB_SHA"
          quick_url="https://energywithmark.com.au/quick-solar-check.js?deploy=$GITHUB_SHA"
          calculator_js_url="https://energywithmark.com.au/calculator-v2.js?deploy=$GITHUB_SHA"

          readiness_status="$(curl -sS -o /tmp/ewm-v4-readiness -D /tmp/ewm-v4-readiness-headers -w '%{http_code}' -H 'Cache-Control: no-cache' "$v4_readiness_url")"
          echo "V4 readiness status: $readiness_status"
          cat /tmp/ewm-v4-readiness || true
          test "$readiness_status" = "200" -o "$readiness_status" = "202"
          grep -Fq '"version":"v4"' /tmp/ewm-v4-readiness
          grep -Fq '"schemaReady":true' /tmp/ewm-v4-readiness
          grep -Fq '"runtimeArmed":true' /tmp/ewm-v4-readiness
          grep -Fq '"attestationReady":true' /tmp/ewm-v4-readiness

          for attempt in $(seq 1 15); do
            echo "Live-site smoke attempt $attempt/15"
            curl -fsS -H 'Cache-Control: no-cache' "$conversion_url" -o /tmp/live-conversion.js || true
            curl -fsS -H 'Cache-Control: no-cache' "$booking_url" -o /tmp/live-book.html || true
            curl -fsS -H 'Cache-Control: no-cache' "$example_url" -o /tmp/live-example.html || true
            curl -fsS -H 'Cache-Control: no-cache' "$contact_url" -o /tmp/live-contact.html || true
            curl -fsS -H 'Cache-Control: no-cache' "$upload_url" -o /tmp/live-upload.html || true
            curl -fsS -H 'Cache-Control: no-cache' "$home_url" -o /tmp/live-home.html || true
            curl -fsS -H 'Cache-Control: no-cache' "$calculator_url" -o /tmp/live-calculator.html || true
            curl -fsS -H 'Cache-Control: no-cache' "$privacy_url" -o /tmp/live-privacy.html || true
            curl -fsS -H 'Cache-Control: no-cache' "$quick_url" -o /tmp/live-quick.js || true
            curl -fsS -H 'Cache-Control: no-cache' "$calculator_js_url" -o /tmp/live-calculator.js || true
            if grep -Fq "$endpoint" /tmp/live-conversion.js 2>/dev/null               && grep -Fq "$endpoint" /tmp/live-book.html 2>/dev/null               && grep -Fq "kind:'appointment_request'" /tmp/live-book.html 2>/dev/null               && grep -Fq 'name="address"' /tmp/live-book.html 2>/dev/null               && grep -Fq 'Example Energy Assessment' /tmp/live-example.html 2>/dev/null               && grep -Fq 'single-property example' /tmp/live-example.html 2>/dev/null               && grep -Fq 'Page 1 of 3' /tmp/live-example.html 2>/dev/null               && grep -Fq 'Strong solar opportunity' /tmp/live-example.html 2>/dev/null               && grep -Fq '2. I look at what matters' /tmp/live-contact.html 2>/dev/null \
              && grep -Fq 'name="phone"' /tmp/live-contact.html 2>/dev/null \
              && grep -Fq 'name="address"' /tmp/live-contact.html 2>/dev/null \
              && grep -Fq 'href="/example-assessment.html">See an Example Assessment' /tmp/live-upload.html 2>/dev/null \
              && grep -Fq 'href="/example-assessment.html">See Example Assessment' /tmp/live-home.html 2>/dev/null \
              && grep -Fq 'mark@energywithmark.com.au' /tmp/live-home.html 2>/dev/null \
              && grep -Fq 'mark@energywithmark.com.au' /tmp/live-contact.html 2>/dev/null \
              && grep -Fq 'mark@energywithmark.com.au' /tmp/live-book.html 2>/dev/null \
              && grep -Fq 'mark@energywithmark.com.au' /tmp/live-upload.html 2>/dev/null \
              && grep -Fq 'mark@energywithmark.com.au' /tmp/live-calculator.html 2>/dev/null \
              && grep -Fq 'mark@energywithmark.com.au' /tmp/live-privacy.html 2>/dev/null \
              && grep -Fq 'name="marketingConsent"' /tmp/live-home.html 2>/dev/null \
              && grep -Fq 'name="marketingConsent"' /tmp/live-contact.html 2>/dev/null \
              && grep -Fq 'name="marketingConsent"' /tmp/live-book.html 2>/dev/null \
              && grep -Fq 'name="marketingConsent"' /tmp/live-upload.html 2>/dev/null \
              && grep -Fq 'name="marketingConsent"' /tmp/live-calculator.html 2>/dev/null \
              && grep -Fq 'id="marketing-emails"' /tmp/live-privacy.html 2>/dev/null \
              && ! grep -Fq 'mark.fitzpatrick@classaenergy.com.au' /tmp/live-home.html 2>/dev/null \
              && ! grep -Fq 'mark.fitzpatrick@classaenergy.com.au' /tmp/live-contact.html 2>/dev/null \
              && ! grep -Fq 'mark.fitzpatrick@classaenergy.com.au' /tmp/live-book.html 2>/dev/null \
              && ! grep -Fq 'mark.fitzpatrick@classaenergy.com.au' /tmp/live-upload.html 2>/dev/null \
              && ! grep -Fq 'mark.fitzpatrick@classaenergy.com.au' /tmp/live-calculator.html 2>/dev/null \
              && ! grep -Fq 'mark.fitzpatrick@classaenergy.com.au' /tmp/live-privacy.html 2>/dev/null \
              && grep -Fq "$endpoint" /tmp/live-quick.js 2>/dev/null \
              && grep -Fq "$endpoint" /tmp/live-calculator.js 2>/dev/null \
              && grep -Fq "ewmV3Hardened" /tmp/live-quick.js 2>/dev/null \
              && grep -Fq "ewmV3Hardened" /tmp/live-calculator.js 2>/dev/null \
              && ! grep -Fq "script.google.com" /tmp/live-quick.js 2>/dev/null \
              && ! grep -Fq "script.google.com" /tmp/live-calculator.js 2>/dev/null; then
              echo "Live public site contains the V3 intake contract and V4 branded contact/consent rollout."
              exit 0
            fi
            sleep 10
          done

          echo "The Pages deployment did not expose the complete V3/V4 public rollout within the smoke-test window."
          exit 1
