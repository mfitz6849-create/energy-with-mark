name: Public Site Intake Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "tests/public-intake-runtime.test.mjs"
      - ".github/workflows/public-site-intake-gate.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "tests/public-intake-runtime.test.mjs"
      - ".github/workflows/public-site-intake-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check public JavaScript
        run: |
          set -euo pipefail
          node --check script.js
          node --check conversion-v1.js
          node --check conversion-v1-base.js
          node --check quick-solar-check.js
          node --check calculator-v2.js

      - name: Run behavioral public intake regression tests
        run: node --test tests/public-intake-runtime.test.mjs

      - name: Verify acknowledgement contracts remain present
        run: |
          set -euo pipefail
          grep -q "energy-with-mark-assessment-submit" conversion-v1.js
          grep -q "energy-with-mark-bill-upload-submit" conversion-v1.js
          grep -q "energy-with-mark-booking-submit" book.html
          grep -q "hardenQuickLead" conversion-v1.js
          grep -q "hardenFullCalculatorLead" conversion-v1.js
          grep -q "hardenBillUpload" conversion-v1.js
          grep -q "hardenGeneralEnquiry" conversion-v1.js
          grep -q 'data-form-type="enquiry"' contact.html
          grep -q 'name="postcode"' book.html

      - name: Verify existing-solar assessment path remains present
        run: |
          set -euo pipefail
          grep -q "Current solar size" conversion-v1.js
          grep -q "existingBattery" conversion-v1.js
          grep -q "existingSystemAge" conversion-v1.js
          grep -q "existingInverter" conversion-v1.js
          grep -q "Do you already have solar" index.html
          grep -q "What do you already have" calculator.html

      - name: Verify rollback base exists
        run: |
          set -euo pipefail
          test -s conversion-v1-base.js
