name: Website Visibility Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: website-growth-agent
  cancel-in-progress: false

jobs:
  continuous-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Website Visibility safety tests before AI
        run: node --test tests/website-growth-agent.test.mjs

      - name: Build whole-site inventory and bounded candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/website-growth-agent.mjs --prepare-checkin /tmp/website-visibility-checkin.json
          node scripts/website-growth-agent.mjs --prepare-request /tmp/growth-request.json
          if [ ! -s /tmp/growth-request.json ]; then
            echo "has_candidate=false" >> "$GITHUB_OUTPUT"
            echo "Whole-site review found no bounded low-risk page due for visible improvement."
          else
            echo "has_candidate=true" >> "$GITHUB_OUTPUT"
            node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/growth-request.json","utf8")); console.log("Candidate: "+v.pagePath+" ("+v.reviewReason+")")'
          fi

      - name: Request GitHub Actions OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=energy-with-mark-website-growth"
          curl --fail --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "$oidc_url"             -o /tmp/oidc-response.json
          node - <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/oidc-response.json", "utf8"));
          if (!payload.value || typeof payload.value !== "string") throw new Error("GitHub OIDC token response is missing its value.");
          fs.writeFileSync("/tmp/oidc-token.txt", payload.value, { mode: 0o600 });
          NODE

      - name: Record successful whole-site check
        shell: bash
        env:
          CHECKIN_ENDPOINT: https://energy-with-mark-website-visibility-machine.energywithmark-admin.workers.dev/api/website-growth/checkin
        run: |
          set -euo pipefail
          token="$(cat /tmp/oidc-token.txt)"
          status="$(curl --silent --show-error --max-time 30             --output /tmp/checkin-response.json --write-out '%{http_code}'             --request POST             --header "Authorization: Bearer ${token}"             --header "Content-Type: application/json"             --data-binary @/tmp/website-visibility-checkin.json             "$CHECKIN_ENDPOINT")"
          test "$status" = "200" || { cat /tmp/checkin-response.json >&2; exit 1; }

      - name: Ask private Business System AI for one bounded proposal
        id: business_system
        if: steps.candidate.outputs.has_candidate == 'true'
        shell: bash
        env:
          GROWTH_ENDPOINT: https://energy-with-mark-website-visibility-machine.energywithmark-admin.workers.dev/api/website-growth/prepare
        run: |
          set -euo pipefail
          token="$(cat /tmp/oidc-token.txt)"
          status="$(curl --silent --show-error --max-time 45             --output /tmp/growth-runtime-response.json --write-out '%{http_code}'             --request POST             --header "Authorization: Bearer ${token}"             --header "Content-Type: application/json"             --data-binary @/tmp/growth-request.json             "$GROWTH_ENDPOINT")"
          if [ "$status" != "200" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Private Business System runtime returned HTTP $status; a repository-reviewed fallback will be tried." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node - <<'NODE'
          const fs = require("fs");
          const request = JSON.parse(fs.readFileSync("/tmp/growth-request.json", "utf8"));
          const response = JSON.parse(fs.readFileSync("/tmp/growth-runtime-response.json", "utf8"));
          if (!response.proposal || !["publish", "no_change"].includes(response.proposal.decision)) throw new Error("Business System response is missing a bounded proposal.");
          if (response.sourceSha !== process.env.GITHUB_SHA || response.sourceSha !== request.sourceSha) throw new Error("Business System response source SHA does not match this trusted run.");
          if (response.pagePath !== request.pagePath) throw new Error("Business System response page path does not match this trusted run.");
          fs.writeFileSync("/tmp/business-system-proposal.json", JSON.stringify(response.proposal));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "available=true\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish="+(response.proposal.decision === "publish" ? "true" : "false")+"\n");
          NODE

      - name: Prepare repository-grounded safe fallback
        id: safe_fallback
        if: steps.candidate.outputs.has_candidate == 'true' && steps.business_system.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/website-growth-agent.mjs --prepare-fallback /tmp/growth-fallback-proposal.json
          echo "available=true" >> "$GITHUB_OUTPUT"
          if [ -s /tmp/growth-fallback-proposal.json ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select bounded proposal
        id: inference
        if: steps.candidate.outputs.has_candidate == 'true'
        shell: bash
        env:
          BUSINESS_AVAILABLE: ${{ steps.business_system.outputs.available }}
          BUSINESS_PUBLISH: ${{ steps.business_system.outputs.publish }}
          FALLBACK_AVAILABLE: ${{ steps.safe_fallback.outputs.available }}
          FALLBACK_PUBLISH: ${{ steps.safe_fallback.outputs.publish }}
        run: |
          set -euo pipefail
          if [ "$BUSINESS_AVAILABLE" = "true" ]; then
            echo "publish=$BUSINESS_PUBLISH" >> "$GITHUB_OUTPUT"
            echo "model=control-centre-workers-ai" >> "$GITHUB_OUTPUT"
            if [ "$BUSINESS_PUBLISH" = "true" ]; then cp /tmp/business-system-proposal.json /tmp/ai-response.json; fi
          elif [ "$FALLBACK_AVAILABLE" = "true" ]; then
            echo "publish=$FALLBACK_PUBLISH" >> "$GITHUB_OUTPUT"
            echo "model=repository-grounded-safe-fallback" >> "$GITHUB_OUTPUT"
            if [ "$FALLBACK_PUBLISH" = "true" ]; then cp /tmp/growth-fallback-proposal.json /tmp/ai-response.json; fi
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "model=unavailable-safe-no-change" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply one low-risk grounded improvement
        if: steps.inference.outputs.publish == 'true'
        env:
          EWM_GROWTH_AI_RESPONSE_FILE: /tmp/ai-response.json
          EWM_GROWTH_OUTPUT_FILE: /tmp/changed-urls.txt
          EWM_GROWTH_MODEL: ${{ steps.inference.outputs.model }}
        run: node scripts/website-growth-agent.mjs

      - name: Re-run safety tests after generated change
        if: steps.inference.outputs.publish == 'true'
        run: node --test tests/website-growth-agent.test.mjs

      - name: Verify generated diff is one classified low-risk article plus evidence files
        id: diff
        if: steps.inference.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          article="$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("/tmp/growth-request.json","utf8")); if(r.riskClass!=="low"||r.pageClass!=="article") process.exit(2); process.stdout.write(r.pagePath)')"
          [[ "$article" =~ ^articles/[a-z0-9-]+\.html$ ]] || { echo "Unsafe article path" >&2; exit 1; }
          git diff --name-only > /tmp/growth-paths.txt
          cat /tmp/growth-paths.txt
          test "$(wc -l < /tmp/growth-paths.txt | tr -d ' ')" = "3"
          grep -Fxq "$article" /tmp/growth-paths.txt
          grep -Fxq "sitemap.xml" /tmp/growth-paths.txt
          grep -Fxq "growth-agent-status.json" /tmp/growth-paths.txt
          echo "article=$article" >> "$GITHUB_OUTPUT"

      - name: Create guarded Website Visibility pull request
        id: pr
        if: steps.inference.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTICLE: ${{ steps.diff.outputs.article }}
        run: |
          set -euo pipefail
          branch="ewm-growth/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "Energy With Mark Website Visibility Agent"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$branch"
          git add "$ARTICLE" sitemap.xml growth-agent-status.json
          git commit -m "Website Visibility Agent: low-risk continuous improvement"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          pr_url="$(gh pr create             --repo "$GITHUB_REPOSITORY"             --base main             --head "$branch"             --title "[Website Visibility Agent] Low-risk continuous improvement"             --body "Whole-site Website Visibility run ${GITHUB_RUN_ID}. One dynamically classified low-risk educational article only. The change is grounded in the page's already-published facts, passed deterministic safety tests before and after generation, and cannot modify customer workflows or automatically add financial, incentive, legal, product-specification or other current-information claims.")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Created $pr_url"

      - name: Record proposed change provenance
        if: steps.inference.outputs.publish == 'true' && steps.pr.outputs.pr_url != ''
        shell: bash
        env:
          CHECKIN_ENDPOINT: https://energy-with-mark-website-visibility-machine.energywithmark-admin.workers.dev/api/website-growth/checkin
          ARTICLE: ${{ steps.diff.outputs.article }}
          RESULTING_REVISION: ${{ steps.pr.outputs.commit_sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("fs");
          const checkin=JSON.parse(fs.readFileSync("/tmp/website-visibility-checkin.json","utf8"));
          const proposal=JSON.parse(fs.readFileSync("/tmp/ai-response.json","utf8"));
          checkin.state="change_proposed";
          checkin.candidatePath=process.env.ARTICLE;
          checkin.change={
            pagePath:process.env.ARTICLE,
            previousRevision:process.env.GITHUB_SHA,
            resultingRevision:process.env.RESULTING_REVISION,
            reason:String(proposal.reason||"Grounded low-risk continuous website improvement").slice(0,1000),
            riskClass:"low",
            testsPassed:["website-growth-agent.test.mjs before generation","website-growth-agent.test.mjs after generation","bounded diff verification"],
            publicationState:"proposed"
          };
          fs.writeFileSync("/tmp/website-visibility-change-checkin.json",JSON.stringify(checkin));
          NODE
          token="$(cat /tmp/oidc-token.txt)"
          curl --fail --silent --show-error --max-time 30             --request POST             --header "Authorization: Bearer ${token}"             --header "Content-Type: application/json"             --data-binary @/tmp/website-visibility-change-checkin.json             "$CHECKIN_ENDPOINT" >/dev/null

      - name: Dispatch independent Website Visibility CI
        if: steps.inference.outputs.publish == 'true' && steps.pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: gh workflow run website-growth-agent-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Record run summary
        shell: bash
        run: |
          {
            echo "### Website Visibility Agent"
            if [ "${{ steps.candidate.outputs.has_candidate }}" != "true" ]; then
              echo "Whole-site check completed. No bounded low-risk page currently needs a visible change."
            elif [ "${{ steps.inference.outputs.publish }}" != "true" ]; then
              echo "A page is review-due, but the bounded inference route returned no safe grounded visible change."
            elif [ -n "${{ steps.pr.outputs.pr_url }}" ]; then
              echo "A low-risk proposal was re-tested and sent through the normal pull-request and independent Website Visibility CI path."
              echo "Pull request: ${{ steps.pr.outputs.pr_url }}"
            else
              echo "A safe proposal was prepared but no source change was published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
