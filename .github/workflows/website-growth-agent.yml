name: Website Growth Agent Guardrails

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/website-growth-agent.yml"
      - "scripts/website-growth-agent.mjs"
      - "growth-agent-policy.json"
      - "growth-agent-status.json"
      - "llms.txt"
      - "robots.txt"
      - "sitemap.xml"
      - "articles/**"
  schedule:
    - cron: "30 20 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-growth-agent-guardrails
  cancel-in-progress: false

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public website
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Website Growth Agent safety tests
        run: node --test tests/website-growth-agent.test.mjs

      - name: Verify live discovery source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import { auditStaticDiscovery } from "./scripts/website-growth-agent.mjs";

          const safeArticles = [
            "articles/how-big-should-home-battery-be.html",
            "articles/do-i-need-hybrid-inverter-for-battery.html",
            "articles/does-battery-mean-whole-home-backup.html",
            "articles/how-ev-changes-solar-sizing.html",
            "articles/what-information-needed-for-solar-assessment.html",
            "articles/what-is-solar-self-consumption.html",
            "articles/why-i-need-your-electricity-bill.html"
          ];

          const [robots, sitemap, llms, policyRaw, statusRaw] = await Promise.all([
            fs.readFile("robots.txt", "utf8"),
            fs.readFile("sitemap.xml", "utf8"),
            fs.readFile("llms.txt", "utf8"),
            fs.readFile("growth-agent-policy.json", "utf8"),
            fs.readFile("growth-agent-status.json", "utf8")
          ]);

          const policy = JSON.parse(policyRaw);
          const status = JSON.parse(statusRaw);
          if (policy.agent !== "Website Growth Agent") throw new Error("Website Growth Agent policy identity is missing.");
          if (status.agent !== "Website Growth Agent" || status.active !== true) throw new Error("Website Growth Agent is not marked active.");

          const issues = [];
          for (const articlePath of safeArticles) {
            try {
              await fs.access(articlePath);
            } catch {
              issues.push(`Missing safe article candidate: ${articlePath}`);
              continue;
            }
            issues.push(...auditStaticDiscovery({ robots, sitemap, llms, articlePath }));
          }
          const unique = [...new Set(issues)];
          if (unique.length) throw new Error(`Discovery guardrail failed: ${unique.join("; ")}`);
          console.log(`Website Growth Agent guardrails passed for ${safeArticles.length} evergreen article candidates.`);
          NODE

      - name: Record guardrail summary
        run: |
          {
            echo "### Website Growth Agent"
            echo "Repository safety and discovery guardrails passed."
            echo "AI research, review and bounded publishing are managed by the Energy With Mark Business System Website Growth Agent."
            echo "This workflow has read-only repository authority and cannot publish customer-visible changes."
          } >> "$GITHUB_STEP_SUMMARY"
