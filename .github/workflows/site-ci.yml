name: Public Website CI

on:
  # Run once per proposed change; avoid the duplicate post-merge hosted run.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Run public website tests
        run: node --test tests/*.test.mjs
